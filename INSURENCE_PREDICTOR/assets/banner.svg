<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="zigzag" width="40" height="20" patternUnits="userSpaceOnUse">
      <polygon points="0,20 20,0 40,20" fill="#B5121B" stroke="#111111" stroke-width="1.5"/>
    </pattern>
    <pattern id="dotsSide" width="20" height="30" patternUnits="userSpaceOnUse">
      <rect width="20" height="30" fill="#FBEFC7"/>
      <circle cx="10" cy="8" r="4" fill="#1F6F45"/>
      <circle cx="10" cy="22" r="3" fill="#B5121B"/>
    </pattern>
    <g id="flower">
      <circle cx="0" cy="-6" r="3" fill="#E8A33D"/>
      <circle cx="6" cy="0" r="3" fill="#E8A33D"/>
      <circle cx="0" cy="6" r="3" fill="#E8A33D"/>
      <circle cx="-6" cy="0" r="3" fill="#E8A33D"/>
      <circle cx="0" cy="0" r="3" fill="#B5121B"/>
    </g>
    <g id="leafCorner">
      <path d="M0,0 C10,2 14,10 6,16 C2,10 0,4 0,0 Z" fill="#1F6F45" stroke="#111111" stroke-width="1"/>
      <circle cx="4" cy="6" r="2" fill="#B5121B"/>
    </g>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" fill="#FBEFC7"/>

  <!-- top / bottom zigzag borders -->
  <rect x="14" y="14" width="1172" height="20" fill="url(#zigzag)"/>
  <rect x="14" y="266" width="1172" height="20" fill="url(#zigzag)"/>

  <!-- side dot borders -->
  <rect x="14" y="14" width="20" height="272" fill="url(#dotsSide)"/>
  <rect x="1166" y="14" width="20" height="272" fill="url(#dotsSide)"/>

  <!-- double inner frame -->
  <rect x="40" y="40" width="1120" height="220" fill="#FBEFC7"/>
  <rect x="40" y="40" width="1120" height="220" fill="none" stroke="#111111" stroke-width="4"/>
  <rect x="46" y="46" width="1108" height="208" fill="none" stroke="#111111" stroke-width="1.5"/>

  <!-- corner leaves -->
  <use href="#leafCorner" x="52" y="52"/>
  <use href="#leafCorner" x="1146" y="52" transform="scale(-1,1) translate(-2298,0)"/>
  <use href="#leafCorner" x="52" y="238" transform="scale(1,-1) translate(0,-490)"/>
  <use href="#leafCorner" x="1146" y="238" transform="scale(-1,-1) translate(-2298,-490)"/>

  <!-- sun motif: rays -->
  <g stroke="#111111" stroke-width="2">
    <polygon points="249.2,140.4 290,150 249.2,159.6" fill="#B5121B"/>
    <polygon points="246.7,168.8 277.3,197.5 237.1,185.4" fill="#E8A33D"/>
    <polygon points="230.4,192.1 242.5,232.3 213.8,201.7" fill="#B5121B"/>
    <polygon points="204.6,204.2 195,245 185.4,204.2" fill="#E8A33D"/>
    <polygon points="176.2,204.2 147.5,232.3 159.6,192.1" fill="#B5121B"/>
    <polygon points="152.9,185.4 112.7,197.5 143.3,168.8" fill="#E8A33D"/>
    <polygon points="140.8,159.6 100,150 140.8,140.4" fill="#B5121B"/>
    <polygon points="143.3,131.2 112.7,102.5 152.9,114.6" fill="#E8A33D"/>
    <polygon points="159.6,107.9 147.5,67.7 176.2,98.3" fill="#B5121B"/>
    <polygon points="185.4,95.8 195,55 204.6,95.8" fill="#E8A33D"/>
    <polygon points="213.8,98.3 242.5,67.7 230.4,107.9" fill="#B5121B"/>
    <polygon points="237.1,114.6 277.3,102.5 246.7,131.2" fill="#E8A33D"/>
  </g>

  <!-- sun face -->
  <circle cx="195" cy="150" r="55" fill="#F2C14E" stroke="#111111" stroke-width="3"/>
  <circle cx="178" cy="140" r="3" fill="#111111"/>
  <circle cx="212" cy="140" r="3" fill="#111111"/>
  <ellipse cx="178" cy="140" rx="14" ry="7" fill="none" stroke="#111111" stroke-width="2"/>
  <ellipse cx="212" cy="140" rx="14" ry="7" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M164,128 Q178,120 192,128" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M198,128 Q212,120 226,128" fill="none" stroke="#111111" stroke-width="2"/>
  <circle cx="195" cy="128" r="3.5" fill="#B5121B"/>
  <path d="M188,158 Q195,152 202,158" fill="none" stroke="#111111" stroke-width="2"/>
  <path d="M172,172 Q195,186 218,172" fill="none" stroke="#B5121B" stroke-width="3"/>
  <circle cx="160" cy="160" r="2" fill="#111111"/>
  <circle cx="230" cy="160" r="2" fill="#111111"/>
  <circle cx="195" cy="185" r="2" fill="#111111"/>

  <!-- title -->
  <text x="340" y="130" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="62" fill="#7A1B1B">Suncover</text>
  <text x="345" y="165" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#3D2B1F">Smart Insurance Charge Predictor</text>

  <!-- creeper vine -->
  <path d="M340,197 Q400,182 460,197 Q520,212 580,197 Q640,182 700,197 Q760,212 820,197 Q880,182 940,197 Q1000,212 1060,197 Q1100,187 1140,197"
        fill="none" stroke="#1F6F45" stroke-width="3"/>
  <use href="#flower" x="400" y="188"/>
  <use href="#flower" x="520" y="207"/>
  <use href="#flower" x="640" y="188"/>
  <use href="#flower" x="760" y="207"/>
  <use href="#flower" x="880" y="188"/>
  <use href="#flower" x="1000" y="207"/>
  <use href="#flower" x="1120" y="192"/>

  <!-- fish motifs, bottom corners -->
  <g stroke="#111111" stroke-width="2">
    <g>
      <polygon points="75,250 95,236 95,264" fill="#2B5F8A"/>
      <ellipse cx="120" cy="250" rx="35" ry="16" fill="#2B5F8A"/>
      <circle cx="145" cy="245" r="2.5" fill="#111111"/>
      <path d="M100,245 Q110,250 100,255" fill="none" stroke="#FBEFC7" stroke-width="1.5"/>
      <path d="M112,242 Q122,250 112,258" fill="none" stroke="#FBEFC7" stroke-width="1.5"/>
    </g>
    <g transform="translate(1200,0) scale(-1,1)">
      <polygon points="75,250 95,236 95,264" fill="#2B5F8A"/>
      <ellipse cx="120" cy="250" rx="35" ry="16" fill="#2B5F8A"/>
      <circle cx="145" cy="245" r="2.5" fill="#111111"/>
      <path d="M100,245 Q110,250 100,255" fill="none" stroke="#FBEFC7" stroke-width="1.5"/>
      <path d="M112,242 Q122,250 112,258" fill="none" stroke="#FBEFC7" stroke-width="1.5"/>
    </g>
  </g>
</svg>