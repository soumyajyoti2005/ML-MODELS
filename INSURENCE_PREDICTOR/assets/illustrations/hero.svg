    <circle cx="412" cy="236" r="21"/>
    <path d="M396 228 L372 254 L396 268 L420 268 L432 240 L448 254 L432 228 Z"/>
  </g>
  <path d="M392 258 L404 258 M398 250 L398 272" stroke="#FFFDF6" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- sparkle stars -->
  <g stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M506 64 L506 30 M482 48 L530 46 M500 40 L512 52"/>
    <path d="M48 320 L48 288 M26 302 L70 304 M44 298 L54 310" stroke="#FFC107"/>
    <path d="M250 96 L250 68 M228 82 L274 82"/>
