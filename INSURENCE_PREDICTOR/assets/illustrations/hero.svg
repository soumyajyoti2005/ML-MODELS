    <path d="M95 132 Q118 146 141 132" fill="none" stroke="#111111" stroke-width="5"/>
  </g>

  <!-- family: adult + child -->
  <g stroke="#111111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="#111111">
    <circle cx="198" cy="252" r="17" fill="#FFC107" stroke="#111111"/>
    <path d="M198 269 L198 352" fill="none"/>
    <path d="M198 292 L172 324 M198 292 L216 326" fill="none" stroke-linecap="round"/>
    <path d="M198 352 L180 392 M198 352 L216 392" fill="none"/>
    <circle cx="266" cy="294" r="13" fill="#FFD54F" stroke="#111111"/>
    <path d="M266 307 L266 366" fill="none"/>
    <path d="M266 324 L282 352" fill="none"/>
    <path d="M266 366 L254 392 M266 366 L278 392" fill="none"/>
