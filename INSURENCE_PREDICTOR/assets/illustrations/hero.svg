  <!-- sun -->
  <g stroke="#111111" stroke-width="5" stroke-linecap="round" fill="#FFD54F">
    <circle cx="118" cy="118" r="56"/>
    <path d="M118 62 L118 26 M62 118 L26 118 M174 118 L206 118 M118 174 L118 206"/>
    <path d="M80 80 L50 52 M156 80 L186 52 M80 156 L50 184 M156 156 L186 184"/>
