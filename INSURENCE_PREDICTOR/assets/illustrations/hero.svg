  <!-- shield with heart + medical plus -->
  <g stroke="#111111" stroke-width="5" stroke-linejoin="round" fill="#FFC107">
    <path d="M382 96 L426 96 L464 144 L464 318 L428 388 L376 388 L326 318 L326 144 Z"/>
  </g>
  <g stroke="#111111" stroke-width="4" fill="#FF6F59">
