<svg viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PulseBloom animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="45%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#F3EEFF"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9C9" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#F9BACB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F9BACB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9BACB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F9BACB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9CEF7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D9CEF7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAFC7"/>
      <stop offset="100%" stop-color="#C9B6F2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#FFF5F7" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="clayShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="7" dy="10" stdDeviation="9" flood-color="#C79DB8" flood-opacity="0.35"/>
      <feDropShadow dx="-5" dy="-5" stdDeviation="7" flood-color="#FFFFFF" flood-opacity="0.75"/>
    </filter>

    <filter id="clayShadowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#C79DB8" flood-opacity="0.3"/>
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.8"/>
    </filter>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1400" height="420" rx="48"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- base -->
    <rect x="0" y="0" width="1400" height="420" fill="url(#bgGrad)"/>

    <!-- drifting ambient clay blobs -->
    <circle cx="140" cy="90" r="150" fill="url(#blobPink)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 18; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1260" cy="340" r="170" fill="url(#blobViolet)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -26 -16; 0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1300" cy="70" r="110" fill="url(#blobPink)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 14; 0 0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="360" r="120" fill="url(#blobViolet)" filter="url(#softBlur)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 20 -14; 0 0" dur="8.5s" repeatCount="indefinite"/>
    </circle>

    <!-- breathing sun / moon orb, day <-> night motif -->
    <g transform="translate(150,150)">
      <circle r="95" fill="url(#sunGlow)">
        <animate attributeName="r" values="90;100;90" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;1;0.75" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="34" fill="#FFF7EC" filter="url(#clayShadowSoft)">
        <animate attributeName="r" values="32;36;32" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- twinkling sparkles -->
    <g fill="#D9CEF7">
      <path d="M 1130 90 L 1136 106 L 1152 112 L 1136 118 L 1130 134 L 1124 118 L 1108 112 L 1124 106 Z" opacity="0.9">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 1200 200 L 1204 210 L 1214 214 L 1204 218 L 1200 228 L 1196 218 L 1186 214 L 1196 210 Z" opacity="0.7" fill="#F9BACB">
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.4s" repeatCount="indefinite" begin="0.6s"/>
      </path>
      <path d="M 250 70 L 253 78 L 261 81 L 253 84 L 250 92 L 247 84 L 239 81 L 247 78 Z" opacity="0.8" fill="#F9BACB">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" repeatCount="indefinite" begin="1.2s"/>
      </path>
    </g>

    <!-- floating blood-cell particles -->
    <g>
      <circle cx="220" cy="270" r="7" fill="#F9BACB" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1220" cy="150" r="6" fill="#D9CEF7" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
      <circle cx="1250" cy="270" r="5" fill="#F9BACB" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.6s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <circle cx="180" cy="330" r="5" fill="#D9CEF7" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -11; 0 0" dur="3s" repeatCount="indefinite" begin="1.3s"/>
      </circle>
    </g>

    <!-- clay ECG card -->
    <rect x="220" y="105" width="965" height="215" rx="44" fill="url(#cardGrad)" filter="url(#clayShadow)"/>

    <!-- ECG baseline (dim, always visible) -->
    <path d="M 250 210 L 275 210 L 285 198 L 295 210 L 305 210 L 315 222 L 325 130 L 335 255 L 345 210 L 360 205 L 380 190 L 400 210 L 430 210 L 455 210 L 465 198 L 475 210 L 485 210 L 495 222 L 505 130 L 515 255 L 525 210 L 540 205 L 560 190 L 580 210 L 610 210 L 635 210 L 645 198 L 655 210 L 665 210 L 675 222 L 685 130 L 695 255 L 705 210 L 720 205 L 740 190 L 760 210 L 790 210 L 815 210 L 825 198 L 835 210 L 845 210 L 855 222 L 865 130 L 875 255 L 885 210 L 900 205 L 920 190 L 940 210 L 970 210 L 995 210 L 1005 198 L 1015 210 L 1025 210 L 1035 222 L 1045 130 L 1055 255 L 1065 210 L 1080 205 L 1100 190 L 1120 210 L 1150 210"
      fill="none" stroke="#2E2633" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ECG traveling pulse (bright comet sweeping the same path, on loop) -->
    <path d="M 250 210 L 275 210 L 285 198 L 295 210 L 305 210 L 315 222 L 325 130 L 335 255 L 345 210 L 360 205 L 380 190 L 400 210 L 430 210 L 455 210 L 465 198 L 475 210 L 485 210 L 495 222 L 505 130 L 515 255 L 525 210 L 540 205 L 560 190 L 580 210 L 610 210 L 635 210 L 645 198 L 655 210 L 665 210 L 675 222 L 685 130 L 695 255 L 705 210 L 720 205 L 740 190 L 760 210 L 790 210 L 815 210 L 825 198 L 835 210 L 845 210 L 855 222 L 865 130 L 875 255 L 885 210 L 900 205 L 920 190 L 940 210 L 970 210 L 995 210 L 1005 198 L 1015 210 L 1025 210 L 1035 222 L 1045 130 L 1055 255 L 1065 210 L 1080 205 L 1100 190 L 1120 210 L 1150 210"
      fill="none" stroke="#F17FA3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="90 3200">
      <animate attributeName="stroke-dashoffset" from="3290" to="-90" dur="3.6s" repeatCount="indefinite"/>
    </path>

    <!-- pulse rings radiating from the heart -->
    <g transform="translate(700,130)">
      <circle r="16" fill="none" stroke="#F9BACB" stroke-width="2.5" opacity="0.8">
        <animate attributeName="r" values="14;60" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="16" fill="none" stroke="#D9CEF7" stroke-width="2.5" opacity="0.8">
        <animate attributeName="r" values="14;60" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      </circle>

      <!-- heartbeat heart, lub-dub double pulse -->
      <g filter="url(#clayShadow)" transform="translate(-26,-24)">
        <g transform-origin="26 11">
          <animateTransform attributeName="transform" type="scale"
            values="1;1.14;0.98;1.1;1;1;1;1"
            keyTimes="0;0.09;0.16;0.24;0.32;0.6;0.8;1"
            dur="2.6s" repeatCount="indefinite"/>
          <path
            d="M26 46 C 2 30 -8 14 -8 0 C -8 -14 2 -24 14 -24 C 20 -24 24 -20 26 -16 C 28 -20 32 -24 38 -24 C 50 -24 60 -14 60 0 C 60 14 50 30 26 46 Z"
            fill="url(#heartGrad)"/>
        </g>
      </g>
    </g>

    <!-- soft outer rim highlight -->
    <rect x="3" y="3" width="1394" height="414" rx="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
