  <circle cx="66" cy="152" r="14" fill="#5A4A80"/>
  <circle cx="120" cy="160" r="16" fill="#6E5AA6"/>
  <circle cx="172" cy="150" r="13" fill="#5A4A80"/>

  <!-- glowing clay heart -->
